name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Paket as a .NET Tool
        run: dotnet tool restore

      - name: Add credentials for Paket
        run: dotnet paket config add-credentials https://nuget.pkg.github.com/dotnet-websharper/index.json --username intellifactory-gh --password ${{ secrets.PAT_PACKAGE }}

      - name: Add GitHub registry NuGet source
        run: dotnet nuget add source https://nuget.pkg.github.com/dotnet-websharper/index.json --name github --username intellifactory-gh --password ${{ secrets.PAT_PACKAGE }} --store-password-in-clear-text

      - name: Restore dependencies using Paket
        run: dotnet paket restore -g Main

      - name: Build sample in Release
        run: dotnet build WebSharper.CredentialManagement.Sample/WebSharper.CredentialManagement.Sample.fsproj --configuration Release

      - name: Prepare deployment
        run: |
          mkdir -p dist
          cp -r WebSharper.CredentialManagement.Sample/wwwroot/* dist/

      - name: Deploy 🚀
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
